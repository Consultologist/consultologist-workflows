name: Publish package

on:
  push:
    tags:
      - "*-v*"
  # A tag push is the normal trigger. This is the manual one, for when the
  # push event never arrives — GitHub dropped tag webhooks during the
  # 2026-08-06 Actions incident, and a tag ref already exists so re-pushing
  # it does not re-trigger. Publishing is CI-only (the registry's write role
  # is on the OIDC principal, not on any human), so without this the only
  # recovery is deleting and re-pushing the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. example-two-documents-v2026.08.1"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a tag push this is already the tag; on a dispatch the default
          # would be the branch, and the package would be published from
          # whatever main happens to hold rather than from the tagged state.
          ref: ${{ inputs.tag || github.ref }}
      - name: Resolve package from tag
        id: pkg
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-v*) ;;
            *) echo "'$TAG' is not a release tag: expected <package>-v<version>, e.g. example-two-documents-v2026.08.1" >&2; exit 1 ;;
          esac
          NAME="${TAG%-v*}"
          VERSION="v${TAG##*-v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('packages/$NAME/manifest.json'))['version'])")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "tag $TAG says $VERSION but manifest declares $MANIFEST_VERSION" >&2
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # #185: the last gate before an IMMUTABLE publish. A package the engine
      # refuses would otherwise reach the registry and fail later at pin resolve,
      # reported as "registry unavailable" — and the remedy would be a new version
      # number, never a fix. Placed before the Azure login so a bad package never
      # gets as far as holding a registry credential.
      #
      # submodules: true is load-bearing — the output-contract catalog lives in
      # the agents submodule, and the validator matches every declared package
      # schema against it. The ref is the deployed engine's commit (#449).
      # #449: which engine is deployed? The app says so itself at Public/Engine,
      # and that commit — not main — is what a package will run against. main
      # stays the fallback when the endpoint cannot say (unreachable, or a build
      # from before the stamp), and the run says which it used. Same policy as
      # the registry check: an outage must not block content work.
      - name: Which engine is deployed
        id: engine
        run: |
          set -euo pipefail
          URL=https://canada-east-ai-function-gmenbbe9erewh4bj.canadaeast-01.azurewebsites.net/api/Public/Engine
          if COMMIT=$(curl -sf --max-time 20 "$URL" | python3 -c 'import json,sys;d=json.load(sys.stdin);c=d.get("Commit") or d.get("commit");print(c) if c else sys.exit(1)'); then
            echo "validating against the deployed engine $COMMIT"
            echo "ref=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "Engine validation ran against the **deployed** engine \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::deployed engine unknown (Public/Engine unreachable or unstamped) — validating against main instead"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Engine validation ran against \`main\` — the deployed engine could not be read." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Consultologist/Consultologist-Blazor
          ref: ${{ steps.engine.outputs.ref }}
          submodules: true
          path: engine
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # The checked-out workspace is the TAGGED tree, which is what we want to
      # validate — and which, for any tag cut before #185, does not contain the
      # validation script. On a tag push that is harmless (the workflow comes
      # from the tag too, so there is no engine step to run), but a
      # workflow_dispatch takes the workflow from main and the content from the
      # tag, and the mismatch would break exactly the recovery path dispatch
      # exists for. So the SCRIPT comes from main and the CONTENT from the tag:
      # newest checker, tagged artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: ci
      - name: Engine validation
        # A guard, not a budget: the step takes about a minute. The first run
        # hung for half an hour on a shell bug, and a stuck step should fail
        # rather than hold a runner.
        timeout-minutes: 10
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: ./ci/scripts/validate-with-engine.sh engine "packages/$NAME"
      - name: Azure login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Publish to the registry
        run: ./scripts/publish-workflow-package.sh consultologistpublic "packages/${{ steps.pkg.outputs.name }}"
      - name: Smoke-check the published artifacts (anonymous)
        run: |
          set -euo pipefail
          BASE="https://consultologistpublic.blob.core.windows.net/workflow-packages"
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          LATEST=$(curl -sf "$BASE/$NAME/latest.json" | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          [ "$LATEST" = "$VERSION" ] || { echo "latest.json says $LATEST, expected $VERSION" >&2; exit 1; }
          curl -sf "$BASE/$NAME/$VERSION/manifest.json" | python3 -c "import json,sys; m=json.load(sys.stdin); print('served:', m['name'], m['version'], 'specVersion', m['specVersion'])"
