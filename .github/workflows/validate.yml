name: Validate packages

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # #449: which engine is deployed? The app says so itself at Public/Engine,
      # and that commit — not main — is what a package will run against. main
      # stays the fallback when the endpoint cannot say (unreachable, or a build
      # from before the stamp), and the run says which it used. Same policy as
      # the registry check: an outage must not block content work.
      - name: Which engine is deployed
        id: engine
        run: |
          set -euo pipefail
          URL=https://canada-east-ai-function-gmenbbe9erewh4bj.canadaeast-01.azurewebsites.net/api/Public/Engine
          if COMMIT=$(curl -sf --max-time 20 "$URL" | python3 -c 'import json,sys;d=json.load(sys.stdin);c=d.get("Commit") or d.get("commit");print(c) if c else sys.exit(1)'); then
            echo "validating against the deployed engine $COMMIT"
            echo "ref=$COMMIT" >> "$GITHUB_OUTPUT"
            echo "Engine validation ran against the **deployed** engine \`$COMMIT\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::deployed engine unknown (Public/Engine unreachable or unstamped) — validating against main instead"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Engine validation ran against \`main\` — the deployed engine could not be read." >> "$GITHUB_STEP_SUMMARY"
          fi
      # #185: the engine's validator needs the app repo AND its agents submodule —
      # the output-contract catalog lives there, and without it every package
      # declaring a node output schema fails for the wrong reason. All three repos
      # are public, so no token is involved. The ref is the deployed commit
      # (#449): not a pin that drifts, but the answer to "what will this run on".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Consultologist/Consultologist-Blazor
          ref: ${{ steps.engine.outputs.ref }}
          submodules: true
          path: engine
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      # #399: the licence uploads with every version, so it has to be here.
      - name: The licence is present
        run: |
          test -f LICENSE && head -1 LICENSE | grep -q "Attribution-NonCommercial-ShareAlike 4.0 International"

      - name: Structural validation
        run: |
          set -euo pipefail
          for MANIFEST in packages/*/manifest.json; do
            DIR=$(dirname "$MANIFEST")
            python3 - "$MANIFEST" << 'PY'
          import json, re, sys, os
          path = sys.argv[1]
          d = os.path.dirname(path)
          m = json.load(open(path))
          name, version = m["name"], m["version"]
          # The path grammar package-format v2026.08.6 publishes: up to four
          # segments (registry-layout.md § 2). A nested name is a path.
          assert re.fullmatch(r"[a-z0-9][a-z0-9-]*(/[a-z0-9][a-z0-9-]*){0,3}", name), f"bad name {name}"
          assert re.fullmatch(r"v\d{4}\.(0[1-9]|1[0-2])\.[1-9]\d*", version), f"bad version {version}"
          missing = []
          for p in m.get("prompts", []):
              if not os.path.exists(os.path.join(d, p["file"])): missing.append(p["file"])
          for f in (m.get("preludes") or {}).values():
              if not os.path.exists(os.path.join(d, f)): missing.append(f)
          for f in (m.get("schemas") or {}).values():
              if not os.path.exists(os.path.join(d, f)): missing.append(f)
          for key, val in (m.get("data") or {}).items():
              if val.endswith("/"):
                  idx = os.path.join(d, val, "index.json")
                  assert os.path.exists(idx), f"missing {val}index.json"
                  for item in json.load(open(idx))["items"]:
                      if "file" in item and not os.path.exists(os.path.join(d, val, item["file"])):
                          missing.append(val + item["file"])
              elif not os.path.exists(os.path.join(d, val)):
                  missing.append(val)
          assert not missing, f"files referenced but absent: {missing}"
          print(f"{name}@{version}: structure OK")
          PY
          done
      # The engine step below already enforces this — WorkflowPackageValidator
      # refuses an unsupported specVersion. But it costs an engine checkout and
      # about a minute to answer a question that is a four-element array, and it
      # answers as a validator error rather than as a sentence saying which
      # document to go and read. Consultologist/consultologist-package-format
      # publishes the set; this reads it (#376).
      #
      # Fetched, not vendored: this repo has no engine checkout at this point,
      # and the published artifact is the thing worth testing against. A registry
      # outage must not fail a pull request, so an unreachable document skips.
      - name: specVersion is one the engine accepts
        run: |
          set -euo pipefail
          BASE=https://consultpubcaeast.blob.core.windows.net/package-format
          if ! VERSION=$(curl -sf --max-time 20 "$BASE/latest.json" | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])'); then
            echo "::warning::package-format registry unreachable — leaving this to the engine step"
            exit 0
          fi
          curl -sf --max-time 20 "$BASE/$VERSION/spec-versions.json" > /tmp/spec-versions.json
          echo "checking against package-format@$VERSION"
          for MANIFEST in packages/*/manifest.json; do
            python3 - "$MANIFEST" << 'PY'
          import json, sys
          index = json.load(open("/tmp/spec-versions.json"))
          manifest = json.load(open(sys.argv[1]))
          spec = manifest.get("specVersion")
          name = manifest["name"]
          if spec in index["supported"]:
              print(f"{name}: specVersion {spec} — {index['documents'][str(spec)]}")
              sys.exit(0)
          accepted = ", ".join(str(v) for v in index["supported"])
          print(f"::error::{name} declares specVersion {spec}; the engine accepts {accepted}. "
                f"See {index['documents'][str(max(index['supported']))]} in "
                f"consultologist-package-format for the newest format.")
          sys.exit(1)
          PY
          done

      # Runs after the structural step on purpose: a manifest that does not parse
      # is reported far better there than by the engine, which can only say it
      # failed to deserialize.
      - name: Engine validation
        # A guard, not a budget: the step takes about a minute. The first run
        # hung for half an hour on a shell bug, and a stuck step should fail
        # rather than hold a runner.
        timeout-minutes: 10
        run: ./scripts/validate-with-engine.sh engine packages/*/
      - name: Version not already published
        run: |
          set -euo pipefail
          for MANIFEST in packages/*/manifest.json; do
            NAME=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['name'])" "$MANIFEST")
            VERSION=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" "$MANIFEST")
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://consultpubcaeast.blob.core.windows.net/workflow-packages/$NAME/$VERSION/manifest.json")
            if [ "$CODE" = "200" ]; then
              echo "::warning::$NAME@$VERSION already published (immutable) — bump the version before tagging"
            else
              echo "$NAME@$VERSION not yet published (HTTP $CODE) — publishable"
            fi
          done
